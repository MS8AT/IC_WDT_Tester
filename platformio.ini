[platformio]
default_envs = ic_wdt_tester
packages_dir = .sdk/packages
platforms_dir = .sdk/platforms
core_dir = .sdk/core

[env:ic_wdt_tester]
platform = espressif32@7.0.1
platform_packages =
    framework-arduinoespressif32@3.20017.241212+sha.dcc1105b
    tool-esptoolpy@2.41100.260830
board = esp32dev
framework = arduino
monitor_speed = 115200
upload_speed = 115200
; Do not use --no-stub here: a normal PlatformIO upload starts from ROM and
; needs its own flasher stub.  The already-resident-stub case is handled only
; inside tools/flash_tester.py, where --no-stub remains intentional.
monitor_dtr = 0
monitor_rts = 0
build_src_filter = -<*> +<main.cpp>
build_flags =
    -DCORE_DEBUG_LEVEL=1
    -DPROBE_GENERATOR=0
    -DAUTO_ICWDT_ENABLED=0
extra_scripts = pre:tools/check_build.py
